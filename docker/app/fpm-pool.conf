; Box D FPM pool sizing (bind-mounted over the image default of 5 children).
; 60 children on 64GB — triple box A's starvation-era 20; request_terminate
; matches the Apache ProxyTimeout 400 stack (see infra: AI-writer 504 layers).
[www]
pm = dynamic
pm.max_children = 60
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 1000
request_terminate_timeout = 400s
; TCP listen for the host Apache proxy_fcgi (host networking).
listen = 127.0.0.1:9000
